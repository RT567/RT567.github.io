<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>FBi Radio auto tracklists</title>
<style>
:root{color-scheme:dark;--bg:#141414;--fg:#ececec;--muted:#9a9a9a;--line:#2c2c2c;--acc:#e4442a;--high:#2fb36a;--med:#e0a51a;--low:#9a9a9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 80px}body.has-player .wrap{padding-bottom:120px}
h1{font-size:28px;margin:0 0 4px}
h1.home{text-align:center;font-size:44px;letter-spacing:-.02em;margin:18px 0 10px;line-height:1.1}h1.home .brand{color:var(--acc)}h1.home .thin{font-weight:300}
p.home-sub{text-align:center;max-width:760px;margin:0 auto 8px}
@media(max-width:600px){h1.home{font-size:30px}}h1 small{font-weight:400;color:var(--muted);font-size:16px}h2{font-size:18px;margin:0}
a{color:var(--acc)}.muted{color:var(--muted)}a.plain{color:var(--fg);text-decoration:none}a.plain:hover{color:var(--acc)}
.crumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
a.btn{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:20px;color:var(--fg);text-decoration:none;font-size:14px;background:rgba(127,127,127,.06)}a.btn:hover{border-color:var(--acc);color:var(--acc)}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
button.seek{font:inherit;font-family:ui-monospace,Menlo,monospace;line-height:1;background:none;border:1px solid var(--line);border-radius:4px;padding:5px 8px;cursor:pointer;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
button.seek .ts{transform:translateY(1px)}
button.seek::before{content:'';width:0;height:0;border-left:7px solid var(--acc);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
button.seek:hover{border-color:var(--acc);color:var(--acc)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid;white-space:nowrap}
.high{color:var(--high);border-color:var(--high)}.mid{color:var(--med);border-color:var(--med)}.low{color:var(--low);border-color:var(--low)}
.official{color:var(--high);border-color:var(--high)}
.badge.generated{border:1px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(100deg,#1f4fd8,#19c3d6,#7a2bd6,#e6198f,#ff5a1f,#f2b705,#12a86b) border-box}
.gradtext,.badge.generated .gtext{background:linear-gradient(100deg,#1f4fd8,#19c3d6,#7a2bd6,#e6198f,#ff5a1f,#f2b705,#12a86b);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.artist{font-weight:600}.title{color:var(--muted)}tr.playing td{background:rgba(228,68,42,.08)}tr.playing button.seek{border-color:var(--acc);color:var(--acc)}
.links{display:flex;gap:6px;margin-top:4px}.links a.icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;border:1px solid var(--line);border-radius:6px}
.links a.icon.bandcamp{color:#1da0c3}.links a.icon.youtube{color:#ff0000}.links a.icon.soundcloud{color:#ff5500}.links a.icon.spotify{color:#1db954}.links a.icon.apple{color:#fa243c}.links a.icon.deezer{color:#a238ff}.links a.icon.shazam{color:#0088ff}.links a.icon.discogs{color:#eee}.links a.icon.link{color:var(--acc)}
.links a.icon.search{opacity:.45;filter:saturate(.7)}.links a.icon:hover{border-color:currentColor;opacity:1;filter:none}
details{margin-top:28px}summary{cursor:pointer;font-weight:600}pre{background:rgba(127,127,127,.08);padding:12px;border-radius:6px;overflow-x:auto;font-size:12px;white-space:pre-wrap}
.mb{margin:10px 0;padding:10px 12px;border-left:3px solid var(--line)}.mb .t{color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:13px}
.ep{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:baseline}
.legend{font-size:13px;color:var(--muted);margin-top:8px}footer{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;color:var(--muted);text-align:center;background:var(--bg);border-top:1px solid var(--line)}
body.has-player footer{bottom:74px;border-top:0;background:transparent}.note{font-size:13px;color:var(--muted);font-style:italic}
.month{margin-top:20px}.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
button.nav{font:inherit;font-size:22px;line-height:1;background:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:4px 14px;cursor:pointer}button.nav:hover{border-color:var(--acc);color:var(--acc)}
button.nav[disabled]{opacity:.35;cursor:not-allowed}button.nav[disabled]:hover{border-color:var(--line);color:var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:48px;border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:2px;color:var(--muted);opacity:.35}.day.empty{border-color:transparent;opacity:0}.day .n{font-weight:600}
a.day.has{color:var(--fg);text-decoration:none;opacity:1}a.day.has:hover{border-color:var(--acc);color:var(--acc)}
.bg{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.3}
.wrap,.player,footer{position:relative;z-index:1}.player,footer{position:fixed}
@media(prefers-reduced-motion:reduce){.bg{display:none}}
.player{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.12);padding:6px 20px 8px;z-index:10}
.player-inner{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:3px}
.player .top{display:flex;align-items:center;gap:10px}.player .now{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.player .now-artist{font-weight:600}.player .now-title{color:var(--muted)}.player .now a{color:var(--muted);text-decoration:none}.player .now a:hover{color:var(--acc)}
.player audio{height:32px;width:100%}
button.close{font:inherit;font-size:18px;line-height:1;background:none;border:1px solid var(--line);border-radius:50%;width:28px;height:28px;color:var(--muted);cursor:pointer}button.close:hover{border-color:var(--acc);color:var(--acc)}
@media(max-width:600px){.wrap{padding:16px 12px 60px}h1{font-size:22px}h1 small{display:block;font-size:14px}
 thead{display:none}table,tbody{display:block}tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
 td{border:0;padding:0}td:nth-child(3){grid-column:2;margin-top:2px}.ep{grid-template-columns:1fr;gap:4px;justify-items:start}.ep>.badge{justify-self:start}.stats{gap:10px}
 .day{min-height:40px;padding:4px}.player{padding:6px 10px 8px}}
</style></head><body>
<canvas class='bg' id='bg' aria-hidden='true'></canvas>
<div class='wrap' id='app'></div>
<div class='player' id='player' hidden><div class='player-inner'><div class='top'><div class='now' id='now'></div><button class='close' id='close' title='Stop and close the player' hidden>×</button></div><audio id='audio' controls preload='none'></audio></div></div>
<script>
const MIN=new Date(2026,7,1);
const NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const app=document.getElementById('app'),audio=document.getElementById('audio'),playerEl=document.getElementById('player'),nowEl=document.getElementById('now'),closeBtn=document.getElementById('close');
let EPS=null;const CACHE={};const player={ep:null,rows:[]};
const h=(tag,attrs={},...kids)=>{const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='html')el.innerHTML=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined&&v!==false)el.setAttribute(k,v===true?'':v);}for(const kid of kids.flat())if(kid!==null&&kid!==undefined)el.append(kid.nodeType?kid:document.createTextNode(kid));return el;};
const pad=n=>String(n).padStart(2,'0');
const fbiUrl=e=>`https://www.fbi.radio/programs/${e.program}/episodes/${e.slug}`;
async function loadIndex(){if(!EPS){EPS=await(await fetch('episodes.json')).json();}return EPS;}
async function loadEp(slug){if(!CACHE[slug]){CACHE[slug]=await(await fetch(`episodes/${slug}.json`)).json();}return CACHE[slug];}
function byDay(eps){const m={};for(const e of eps)(m[e.date]=m[e.date]||[]).push(e);return m;}

async function viewCalendar(ym){const eps=await loadIndex(),days=byDay(eps);
  let cur;if(ym){const[y,mo]=ym.split('-');cur=new Date(+y,+mo-1,1);}else{const latest=Object.keys(days).sort().pop();cur=latest?new Date(+latest.slice(0,4),+latest.slice(5,7)-1,1):new Date();}if(cur<MIN)cur=new Date(MIN);
  const y=cur.getFullYear(),m=cur.getMonth();const atMin=cur<=MIN;
  const grid=h('div',{class:'cal'});for(const w of['Mo','Tu','We','Th','Fr','Sa','Su'])grid.append(h('div',{class:'wd'},w));
  const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)grid.append(h('div',{class:'day empty'}));
  for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`;grid.append(days[k]?h('a',{class:'day has',href:`#/day/${k}`},h('span',{class:'n'},d)):h('div',{class:'day'},h('span',{class:'n'},d)));}
  app.replaceChildren(
    h('h1',{class:'home'},h('span',{class:'brand'},'FBi'),' Radio ',h('span',{class:'thin'},'auto tracklists')),
    h('p',{class:'muted home-sub'},h('span',{class:'gradtext'},'Generating'),' automatic tracklists for FBi show recordings that were uploaded without one'),
    h('div',{class:'month'},h('div',{class:'monthnav'},
      h('button',{class:'nav',disabled:atMin,title:atMin?"Sorry — nothing before August 2026, that's as far back as this goes":null,onclick:()=>{if(!atMin)nav(m===0?`#/${y-1}-12`:`#/${y}-${pad(m)}`)}},'‹'),
      h('h2',{},`${NAMES[m]} ${y}`),
      h('button',{class:'nav',onclick:()=>nav(m===11?`#/${y+1}-01`:`#/${y}-${pad(m+2)}`)},'›')),grid),
    h('footer',{},'Site made by Rob T for the love of the game'));
}
async function viewDay(date){const eps=(await loadIndex()).filter(e=>e.date===date).sort((a,b)=>a.airedAt.localeCompare(b.airedAt));
  if(!eps.length){app.replaceChildren(crumbs(),h('p',{},'Nothing on that day.'));return;}
  const list=eps.map(e=>{let link,sub,right='';
    if(e.status==='generated'){link=h('a',{href:`#/ep/${e.slug}`},e.title);sub=h('span',{class:'muted'},`${e.n_tracks} tracks`,e.n_official?[' · ',h('a',{href:fbiUrl(e),target:'_blank',rel:'noopener'},'official tracklist ↗')]:null);
      right=genBadge();}
    else if(e.status==='official'){link=h('a',{href:fbiUrl(e),target:'_blank',rel:'noopener'},e.title+' ↗');sub=h('span',{class:'muted'},`${e.n_official} tracks`);right=h('span',{class:'badge official'},'official');}
    else{link=h('a',{class:'plain',href:fbiUrl(e),target:'_blank',rel:'noopener'},e.title+' ↗');sub=h('span',{class:'muted'},'no tracklist');}
    return h('div',{class:'ep'},h('span',{class:'t'},e.time),h('span',{},link,' ',h('span',{class:'muted'},hostsShort(e.hosts)),h('br'),sub),right);});
  app.replaceChildren(crumbs(),h('h1',{},eps[0].day,' ',h('small',{},`${eps.length} show${eps.length!==1?'s':''}`)),...list);
}
const ICONS={
 bandcamp:"<svg viewBox='0 0 24 24' width='18' height='18' aria-hidden='true'><path fill='currentColor' d='M0 18.75l7.437-13.5H24l-7.437 13.5z'/></svg>",
 youtube:"<svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path fill='currentColor' d='M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6z'/></svg>",
 soundcloud:"<svg viewBox='0 0 24 24' width='20' height='20' aria-hidden='true'><path fill='currentColor' d='M1.2 14.2c-.1 0-.2.1-.2.2l-.3 2 .3 2c0 .1.1.2.2.2s.2-.1.2-.2l.3-2-.3-2c0-.1-.1-.2-.2-.2zm2-1.3c-.1 0-.2.1-.2.2l-.3 3.3.3 3.2c0 .1.1.2.2.2s.2-.1.2-.2l.4-3.2-.4-3.3c0-.1-.1-.2-.2-.2zm2-1c-.1 0-.3.1-.3.3l-.3 4.2.3 4c0 .2.2.3.3.3s.2-.1.3-.3l.3-4-.3-4.2c0-.2-.2-.3-.3-.3zm2.1-.3c-.2 0-.3.1-.3.3l-.3 4.5.3 4.1c0 .2.1.3.3.3s.3-.1.3-.3l.3-4.1-.3-4.5c0-.2-.1-.3-.3-.3zm2.1-1.4c-.2 0-.4.2-.4.4l-.2 5.8.2 4c0 .2.2.4.4.4s.4-.2.4-.4l.3-4-.3-5.8c0-.2-.2-.4-.4-.4zm2.2-1.4c-.2 0-.4.2-.4.4l-.2 7.2.2 4c0 .2.2.4.4.4s.4-.2.4-.4l.2-4-.2-7.2c0-.2-.2-.4-.4-.4zm7.5 3.6c-.5 0-1 .1-1.5.3A5.8 5.8 0 0 0 12 7.5c-.1 0-.2.1-.2.2v11.9c0 .1.1.2.2.2h7.1a3.3 3.3 0 0 0 0-6.6z'/></svg>",
 spotify:"<svg viewBox='0 0 24 24' width='19' height='19' aria-hidden='true'><path fill='currentColor' d='M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.5 17.3a.75.75 0 0 1-1 .25c-2.8-1.7-6.4-2.1-10.6-1.2a.75.75 0 1 1-.3-1.5c4.6-1 8.5-.6 11.7 1.4.3.2.4.7.2 1zm1.5-3.3a.94.94 0 0 1-1.3.3c-3.2-2-8.1-2.6-12-1.4a.94.94 0 1 1-.5-1.8c4.4-1.3 9.8-.7 13.5 1.6.4.3.5.9.3 1.3zm.1-3.4c-3.9-2.3-10.3-2.5-14-1.4a1.1 1.1 0 1 1-.7-2.2c4.3-1.3 11.4-1 15.9 1.6a1.1 1.1 0 0 1-1.2 2z'/></svg>",
 apple:"<svg viewBox='0 0 24 24' width='18' height='18' aria-hidden='true'><path fill='currentColor' d='M16.4 12.7c0-2.5 2-3.7 2.1-3.7-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.8a4.9 4.9 0 0 0-4.1 2.5c-1.8 3.1-.5 7.6 1.3 10.1.8 1.2 1.8 2.6 3.1 2.5 1.3 0 1.7-.8 3.3-.8 1.5 0 1.9.8 3.3.8 1.4 0 2.2-1.2 3-2.5.9-1.4 1.3-2.8 1.4-2.8 0 0-2.6-1-2.7-4.2zM14 5.4c.7-.8 1.1-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z'/></svg>",
 deezer:"<svg viewBox='0 0 24 24' width='19' height='19' aria-hidden='true'><g fill='currentColor'><rect x='1' y='16' width='4' height='2.5'/><rect x='6.25' y='16' width='4' height='2.5'/><rect x='11.5' y='16' width='4' height='2.5'/><rect x='16.75' y='16' width='4' height='2.5'/><rect x='6.25' y='12.5' width='4' height='2.5'/><rect x='11.5' y='12.5' width='4' height='2.5'/><rect x='16.75' y='12.5' width='4' height='2.5'/><rect x='11.5' y='9' width='4' height='2.5'/><rect x='16.75' y='9' width='4' height='2.5'/><rect x='16.75' y='5.5' width='4' height='2.5'/></g></svg>",
 shazam:"<svg viewBox='0 0 24 24' width='19' height='19' aria-hidden='true'><circle cx='12' cy='12' r='11' fill='currentColor'/><path fill='none' stroke='#fff' stroke-width='2.4' stroke-linecap='round' d='M14.5 7.5l2.2 2.2a3 3 0 0 1 0 4.2l-3 3M9.5 16.5l-2.2-2.2a3 3 0 0 1 0-4.2l3-3'/></svg>",
 discogs:"<svg viewBox='0 0 24 24' width='18' height='18' aria-hidden='true'><circle cx='12' cy='12' r='10' fill='none' stroke='currentColor' stroke-width='2'/><circle cx='12' cy='12' r='5.5' fill='none' stroke='currentColor' stroke-width='1.5'/><circle cx='12' cy='12' r='1.6' fill='currentColor'/></svg>",
 link:"<svg viewBox='0 0 24 24' width='18' height='18' aria-hidden='true'><path fill='none' stroke='currentColor' stroke-width='2' d='M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5'/></svg>"};
const NAMES_SVC={bandcamp:'Bandcamp',youtube:'YouTube',soundcloud:'SoundCloud',spotify:'Spotify',apple:'Apple Music',deezer:'Deezer',discogs:'Discogs',shazam:'Shazam'};
function linkIcon(l){const svc=l.label.replace('search ','');const a=h('a',{class:'icon '+(ICONS[svc]?svc:'link')+(l.search?' search':''),href:l.url,target:'_blank',rel:'noopener',title:l.search?`Search ${NAMES_SVC[svc]||svc} for this track`:`Open on ${NAMES_SVC[svc]||svc}`,'aria-label':l.search?`search ${svc}`:svc});a.innerHTML=ICONS[svc]||ICONS.link;return a;}
function hostsShort(h){const n=(h||'').split(',').map(x=>x.trim()).filter(Boolean);return n.length>4?n.slice(0,4).join(', ')+` & ${n.length-4} more`:n.join(', ');}
function genBadge(){return h('span',{class:'badge generated'},h('span',{class:'gtext'},'generated'));}
function crumbs(...extra){return h('nav',{class:'crumbs'},h('a',{class:'btn',href:'#/'},'‹ All dates'),...extra);}
async function viewEp(slug){let ep;try{ep=await loadEp(slug);}catch(e){app.replaceChildren(crumbs(),h('p',{},'No tracklist here for that show.'));return;}
  const rows=ep.rows.map(r=>{const tr=h('tr',{'data-t':r.t});
    tr.append(h('td',{},r.t!==null&&ep.audio_url?h('button',{class:'seek',onclick:()=>play(ep,r.t)},h('span',{class:'ts'},r.time)):h('span',{class:'t'},r.time)),
      h('td',{},h('span',{class:'artist'},r.artist),' ',h('span',{class:'title'},r.title||'(title unknown)'),
        ...r.notes.map(n=>h('div',{class:'note'},n)),
        h('div',{class:'links'},...r.links.map(linkIcon))),
      h('td',{},h('span',{class:`badge ${r.conf}`},r.conf)));return tr;});
  const ev=ep.eval;
  app.replaceChildren(crumbs(h('a',{class:'btn',href:`#/day/${ep.date}`},'‹ '+ep.dayShort)),
    h('h1',{},ep.title,' ',h('small',{},ep.date,ep.hosts?' · '+ep.hosts:'')),
    h('table',{},h('thead',{},h('tr',{},h('th',{},'time'),h('th',{},'track'),h('th',{},'confidence'))),h('tbody',{},...rows)));
  if(ep.audio_url)loadPlayer(ep);else syncPlayer();
}
function loadPlayer(ep){if(player.ep?.slug===ep.slug)return;player.ep=ep;player.rows=ep.rows.filter(r=>r.t!==null);audio.src=ep.audio_url;document.body.classList.add('has-player');playerEl.hidden=false;syncPlayer();}
function play(ep,t){loadPlayer(ep);const go=()=>{audio.currentTime=t;audio.play();};if(audio.readyState>=1)go();else{audio.addEventListener('loadedmetadata',go,{once:true});audio.load();}syncPlayer();}
function closePlayer(){audio.pause();audio.removeAttribute('src');audio.load();player.ep=null;playerEl.hidden=true;document.body.classList.remove('has-player');}
closeBtn.onclick=closePlayer;
function syncPlayer(){if(!player.ep)return;const onOwn=location.hash===`#/ep/${player.ep.slug}`;closeBtn.hidden=onOwn;
  let cur=null;if(!(audio.paused&&audio.currentTime===0))for(const r of player.rows)if(r.t<=audio.currentTime)cur=r;
  if(onOwn)document.querySelectorAll('tr[data-t]').forEach(tr=>tr.classList.toggle('playing',cur&&+tr.dataset.t===cur.t));
  nowEl.replaceChildren(h('span',{},cur?h('span',{class:'now-artist'},cur.artist):h('span',{class:'now-artist'},player.ep.title),' ',h('span',{class:'now-title'},cur?cur.title||'':player.ep.hosts),onOwn?null:[' · ',h('a',{href:`#/ep/${player.ep.slug}`},player.ep.title+' ›')]));}
audio.addEventListener('timeupdate',syncPlayer);
function nav(hash){location.hash=hash;}
function route(){const hsh=location.hash||'#/';let m;
  if((m=/^#\/ep\/([\w-]+)$/.exec(hsh)))viewEp(m[1]);else if((m=/^#\/day\/(\d{4}-\d{2}-\d{2})$/.exec(hsh)))viewDay(m[1]);else if((m=/^#\/(\d{4}-\d{2})$/.exec(hsh)))viewCalendar(m[1]);else viewCalendar();
  window.scrollTo(0,0);syncPlayer();}
